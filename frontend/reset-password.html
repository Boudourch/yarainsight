<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Yara Insights</title>
    <link rel="stylesheet" href="css/password.style.css">
</head>
<body>
    <div class="reset-container">
        <h2>Reset Password</h2>
        <p>Enter the code received by email and your new password.</p>
        
        <form id="resetForm">
            <input type="hidden" id="email" value="">
            <input type="text" id="code" placeholder="Reset code" required>
            <input type="password" id="newPassword" placeholder="New password" required>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>
            <button type="submit">Reset password</button>
        </form>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001/api/auth';
        
        // Get email from URL
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            document.getElementById('email').value = decodeURIComponent(email);
        } else {
            document.getElementById('message').innerHTML = 'Email missing. <a href="forgot-password.html">Back</a>';
            document.getElementById('message').className = 'message error';
        }
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userEmail = document.getElementById('email').value;
            const code = document.getElementById('code').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');
            
            if (newPassword !== confirmPassword) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = 'Passwords do not match';
                return;
            }
            
            if (newPassword.length < 6) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = 'Password must be at least 6 characters';
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: userEmail, 
                        code: code, 
                        newPassword: newPassword 
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.innerHTML = data.message + ' Redirecting to login page...';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.innerHTML = data.message || 'An error occurred';
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = 'Server connection error';
            }
        });
    </script>
</body>
</html>
