<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Yara Insights</title>
    <link rel="stylesheet" href="css/password.style.css">
</head>
<body>
    <div class="forgot-container">
        <h2>Forgot Password</h2>
        <p>Enter your email to receive a reset code.</p>
        
        <form id="forgotForm">
            <input type="email" id="email" placeholder="Your email" required>
            <button type="submit">Send code</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="back-link">
            <a href="login.html">← Back to login</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001/api/auth';
        
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');
            
            try {
                const response = await fetch(`${API_URL}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.innerHTML = data.message + ' Redirecting in 3 seconds...';
                    setTimeout(() => {
                        window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
                    }, 3000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.innerHTML = data.message || 'An error occurred';
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = 'Server connection error';
            }
        });
    </script>
</body>
</html>
